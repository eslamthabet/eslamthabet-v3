# Pages CMS — لوحة تحكم المقالات لموقع eslamtgd
# اكتب ٣ حاجات بس: عنوان المقال + القسم + نص المقال.
# كل الباقي (الرابط، التاريخ، التاريخ بالعربي، مدة القراءة، المقدمة، وصف جوجل، صورة الغلاف)
# بيتعمل تلقائياً وقت النشر. أي حفظ هنا يشغّل GitHub Action يعيد بناء المدونة تلقائياً.

media:
  input: assets/blog
  output: /assets/blog

content:
  - name: articles
    label: 📝 مقالات المدونة
    type: collection
    path: content/blog
    filename: "{title}.md"
    view:
      fields: [title, category]
      primary: title
    fields:
      - name: title
        label: عنوان المقال
        type: string
      - name: category
        label: القسم
        type: select
        options:
          values:
            - { name: prompts, label: برومبتات الذكاء الاصطناعي }
            - { name: courses, label: كورسات مجانية وتعلّم ذاتي }
            - { name: ai-tools, label: مواقع وأدوات AI مجانية }
            - { name: tech, label: تقنية وأخبار التكنولوجيا }
            - { name: tutorials, label: شروحات وتقنيات صناعة المحتوى }
            - { name: income, label: الربح والعمل الحر بالـ AI }
      - name: body
        label: "نص المقال (عنوان قسم جديد = Heading 2، والاقتباس > يتحول لصندوق نصيحة)"
        type: rich-text
